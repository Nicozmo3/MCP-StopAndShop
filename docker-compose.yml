version: "3.8"

services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-server
    restart: always
    environment:
      DB_HOST: sas-db
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-stopandshop}
      DB_PORT: 3306
      PORT: 8443
      HOST: 0.0.0.0
      TRANSPORT: https
      SSL_CERTFILE: /app/certs/server.crt
      SSL_KEYFILE: /app/certs/server.key
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
    ports:
      - "8443:8443"
    networks:
      - stop-shop_sas-net

networks:
  stop-shop_sas-net:
    external: true

